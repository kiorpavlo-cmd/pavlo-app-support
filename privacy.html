en:{brand:"Pavlo Kior · Privacy",back:"Support page",eyebrow:"Privacy",title:"Privacy Policy",updated:"Last updated:",intro:"This policy explains how Pavlo Kior handles information when you visit the app-support website or use an app I develop. The features you use determine which parts apply. Fat Alien-specific practices are described below.",footer:"Pavlo Kior · Independent app developer",contact:"Contact about privacy",sections:[
["Who is responsible",["Pavlo Kior is responsible for personal information that I receive directly, for example when you contact me for support. You can reach me at <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>."]],
["Information handled by the support website",["The support site is a static website hosted by GitHub Pages. GitHub may log visitors’ IP addresses and technical request information for hosting and security. The site has no account, contact form, advertising, analytics tools, or cookies that I have added. If you email me, I receive your email address and the message or attachments you choose to send; I use them to answer and resolve your request."]],
["Fat Alien: information and device permissions",["Depending on the features you choose, Fat Alien stores information on your device such as your account identifier and sign-in provider (Apple or Google), email address if provided by that provider, profile details (for example name or nickname, date of birth, gender, height and avatar), food diary entries, nutrition values, custom foods and recipes, goals, weight and body-fat measurements, and app preferences.","If you enable iCloud sync, app records are synced to your personal private CloudKit database associated with your Apple Account. Apple operates iCloud and handles that data under its own terms and privacy policy. The app can also use HealthKit with your permission: it can read active and basal energy and body weight/body-fat values, and write weight and body-fat values to Health. HealthKit access is optional. App data may be synced to your iCloud database when sync is enabled; I do not operate a separate health-data server.","When you look up a product by barcode, Fat Alien sends that barcode to Open Food Facts to retrieve product information. That request also carries normal network information, such as your IP address, to the service. The app does not include your sign-in details or food diary in that lookup. Nutrition-label text recognition is processed on your device; label images are not sent to my server by this feature."]],
["How information is used",["Information is used to provide the features you request, save and restore your app data, synchronize data when you enable iCloud sync, perform barcode lookups, and respond to support requests. The Fat Alien source reviewed for this policy does not include third-party advertising or analytics SDKs. I do not sell personal information."]],
["Service providers and other recipients",["Information is shared only with services needed for the feature you choose: Apple for Sign in with Apple, iCloud/CloudKit and HealthKit; Google when you choose Google sign-in; Open Food Facts for barcode searches; GitHub Pages to host this website; and your email provider when you contact support. These providers handle information under their own privacy terms. I do not give your app information to advertisers."]],
["Storage and retention",["App information is stored locally on your device. If you turn on iCloud sync, synced records are stored in your private CloudKit database. Email correspondence is kept for as long as needed to answer your request and for reasonable record-keeping or legal requirements. Website technical logs are handled by GitHub under its own practices."]],
["Your choices, access and deletion",["You can decline optional camera, HealthKit or iCloud permissions and can turn off iCloud sync in the app. You can contact me to ask about information I may hold from support correspondence or to exercise privacy rights available where you live.","The current Fat Alien app provides sign-out and data export, but does not provide a complete in-app account and associated CloudKit-data deletion flow. Signing out or uninstalling the app does not necessarily delete synced iCloud records. To ask for help with a deletion request, email me; removing data stored in iCloud may also require steps in Apple’s account or iCloud controls. This limitation is stated here so the policy accurately reflects the current app.","If you are in the EEA or UK, you may have rights to request access, correction, deletion, restriction or portability, to object to certain processing, and to withdraw consent where processing relies on consent. You may also complain to your local data-protection authority."]],
["Children, changes and contact",["Fat Alien may ask for a date of birth to personalize nutrition goals. A parent or guardian who has a privacy concern about a child’s information can contact me. I may update this policy when app features or data practices change; the date above shows the latest revision.","For privacy questions or requests, contact <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>. Please do not send passwords, sign-in codes, or unnecessary sensitive information."]]
],linksLabel:"Provider privacy policies and service terms",links:[["Apple Privacy","https://www.apple.com/legal/privacy/"],["Google Privacy","https://policies.google.com/privacy"],["GitHub Privacy","https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"],["Open Food Facts usage terms","https://world.openfoodfacts.org/terms-of-use"]]},
ru:{brand:"Pavlo Kior · Конфиденциальность",back:"Страница поддержки",eyebrow:"Конфиденциальность",title:"Политика конфиденциальности",updated:"Последнее обновление:",intro:"В этой политике описано, как Павло Киор обрабатывает информацию при посещении сайта поддержки и использовании разработанных мной приложений. Применяются только разделы, относящиеся к используемым вами функциям. Практики Fat Alien описаны отдельно ниже.",footer:"Pavlo Kior · Независимый разработчик приложений",contact:"Связаться по вопросам конфиденциальности",sections:[
["Ответственный за данные",["Павло Киор отвечает за персональные данные, которые получает напрямую, например когда вы обращаетесь в поддержку. Напишите на <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>."]],
["Информация на сайте поддержки",["Сайт поддержки — статический сайт на GitHub Pages. GitHub может сохранять IP-адреса посетителей и технические сведения о запросах для работы сайта и безопасности. На сайте нет учетных записей, форм обратной связи, рекламы, аналитики или добавленных мной файлов cookie. Если вы напишете мне, я получу ваш адрес электронной почты, сообщение и приложенные файлы, которые вы решите отправить, и использую их для ответа и решения вопроса."]],
["Fat Alien: данные и разрешения устройства",["В зависимости от выбранных функций Fat Alien хранит на устройстве такие сведения, как идентификатор учетной записи и способ входа (Apple или Google), адрес электронной почты, если его передал провайдер входа, данные профиля (например, имя или псевдоним, дата рождения, пол, рост и аватар), записи дневника питания, пищевую ценность, пользовательские продукты и рецепты, цели, показатели веса и процента жира, а также настройки приложения.","Если включить синхронизацию iCloud, данные приложения синхронизируются с вашей личной закрытой базой CloudKit, связанной с Apple Account. iCloud обслуживает Apple; данные обрабатываются по условиям и политике Apple. С разрешения пользователя приложение может использовать HealthKit: считывать активную и базовую энергию, вес и процент жира, а также записывать вес и процент жира в приложение «Здоровье». Доступ к HealthKit необязателен. При включенной синхронизации данные приложения могут передаваться в вашу базу iCloud; отдельного сервера для медицинских данных у меня нет.","При поиске продукта по штрихкоду Fat Alien отправляет этот код в Open Food Facts, чтобы получить сведения о продукте. Запрос также передает сервису обычные сетевые данные, например IP-адрес. Данные входа или дневник питания в такой запрос не включаются. Распознавание текста с этикетки выполняется на устройстве; изображения этикеток эта функция не отправляет на мой сервер."]],
["Как используется информация",["Информация используется для работы выбранных вами функций, сохранения и восстановления данных приложения, синхронизации при включенном iCloud, поиска по штрихкоду и ответа на обращения в поддержку. В проверенном исходном коде Fat Alien нет сторонних SDK для рекламы или аналитики. Я не продаю персональные данные."]],
["Поставщики услуг и другие получатели",["Информация передается только сервисам, необходимым для выбранной функции: Apple — для входа через Apple, iCloud/CloudKit и HealthKit; Google — если вы выберете вход через Google; Open Food Facts — для поиска по штрихкоду; GitHub Pages — для размещения сайта; вашему почтовому провайдеру — если вы напишете в поддержку. Эти сервисы обрабатывают данные по собственным правилам. Я не передаю данные приложения рекламодателям."]],
["Хранение и сроки",["Данные приложения хранятся локально на устройстве. Если включена синхронизация iCloud, синхронизированные записи хранятся в вашей закрытой базе CloudKit. Переписка по электронной почте хранится столько, сколько необходимо для ответа и в течение разумного срока для учета или выполнения требований закона. Технические журналы сайта обрабатываются GitHub согласно его правилам."]],
["Ваш выбор, доступ и удаление данных",["Вы можете отказаться от необязательного доступа к камере, HealthKit или iCloud, а синхронизацию iCloud можно отключить в приложении. Вы можете написать мне с вопросом о данных из переписки с поддержкой или воспользоваться правами на конфиденциальность, предусмотренными в вашей стране.","Текущая версия Fat Alien позволяет выйти из аккаунта и экспортировать данные, но в ней нет полного удаления аккаунта и связанных данных CloudKit прямо из приложения. Выход или удаление приложения не обязательно удаляет синхронизированные записи iCloud. Чтобы запросить помощь с удалением, напишите мне; для удаления данных из iCloud также могут потребоваться действия в настройках Apple Account или iCloud. Это ограничение указано, чтобы политика соответствовала текущим функциям приложения.","Если вы находитесь в ЕЭЗ или Великобритании, у вас могут быть права запросить доступ, исправление, удаление, ограничение обработки или перенос данных, возразить против некоторых способов обработки и отозвать согласие, если обработка основана на нем. Вы также можете обратиться в местный орган по защите данных."]],
["Дети, изменения и связь",["Fat Alien может запросить дату рождения, чтобы персонализировать цели питания. Родитель или опекун, обеспокоенный обработкой данных ребенка, может связаться со мной. Я могу обновлять эту политику при изменении функций или практик обработки; дата выше указывает последнее обновление.","По вопросам конфиденциальности или для запросов напишите на <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>. Не отправляйте пароли, коды входа и лишние конфиденциальные сведения."]]
],linksLabel:"Политики конфиденциальности и условия сервисов-провайдеров",links:[["Конфиденциальность Apple","https://www.apple.com/legal/privacy/"],["Конфиденциальность Google","https://policies.google.com/privacy"],["Конфиденциальность GitHub","https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"],["Условия Open Food Facts","https://world.openfoodfacts.org/terms-of-use"]]},
uk:{brand:"Pavlo Kior · Конфіденційність",back:"Сторінка підтримки",eyebrow:"Конфіденційність",title:"Політика конфіденційності",updated:"Останнє оновлення:",intro:"У цій політиці пояснено, як Павло Кіор обробляє інформацію під час відвідування сайту підтримки та користування розробленими мною застосунками. Застосовуються лише розділи, що стосуються функцій, якими ви користуєтеся. Практики Fat Alien описані окремо нижче.",footer:"Pavlo Kior · Незалежний розробник застосунків",contact:"Зв’язатися щодо конфіденційності",sections:[
["Відповідальний за дані",["Павло Кіор відповідає за персональні дані, які отримує безпосередньо, наприклад коли ви звертаєтеся до підтримки. Напишіть на <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>."]],
["Інформація на сайті підтримки",["Сайт підтримки — статичний сайт на GitHub Pages. GitHub може реєструвати IP-адреси відвідувачів і технічні відомості про запити для роботи сайту та безпеки. На сайті немає облікових записів, форм зворотного зв’язку, реклами, аналітики чи файлів cookie, які додав я. Якщо ви напишете мені, я отримаю вашу адресу електронної пошти, повідомлення та вкладення, які ви вирішите надіслати, і використаю їх для відповіді та розв’язання питання."]],
["Fat Alien: дані та дозволи пристрою",["Залежно від вибраних функцій Fat Alien зберігає на пристрої такі відомості: ідентифікатор облікового запису та спосіб входу (Apple або Google), адресу електронної пошти, якщо її передав сервіс входу, дані профілю (наприклад, ім’я чи псевдонім, дата народження, стать, зріст і аватар), записи щоденника харчування, поживну цінність, власні продукти й рецепти, цілі, показники ваги та відсотка жиру, а також налаштування застосунку.","Якщо ввімкнути синхронізацію iCloud, дані застосунку синхронізуються з вашою особистою приватною базою CloudKit, пов’язаною з Apple Account. iCloud обслуговує Apple, а дані обробляються за умовами й політикою Apple. З вашого дозволу застосунок може використовувати HealthKit: зчитувати активну й базову енергію, вагу та відсоток жиру, а також записувати вагу й відсоток жиру в «Здоров’я». Доступ до HealthKit необов’язковий. Коли синхронізацію ввімкнено, дані застосунку можуть синхронізуватися з iCloud; окремого сервера медичних даних я не використовую.","Під час пошуку продукту за штрихкодом Fat Alien надсилає цей код до Open Food Facts, щоб отримати відомості про продукт. Запит також передає сервісу звичайну мережеву інформацію, наприклад IP-адресу. Дані входу чи щоденник харчування до такого запиту не додаються. Розпізнавання тексту етикетки виконується на пристрої; ця функція не надсилає зображення на мій сервер."]],
["Як використовується інформація",["Інформація потрібна для роботи вибраних функцій, збереження й відновлення даних застосунку, синхронізації за ввімкненого iCloud, пошуку за штрихкодом і відповіді на звернення до підтримки. У перевіреному вихідному коді Fat Alien немає сторонніх SDK для реклами чи аналітики. Я не продаю персональні дані."]],
["Постачальники послуг та інші отримувачі",["Інформація передається лише сервісам, потрібним для вибраної функції: Apple — для входу через Apple, iCloud/CloudKit і HealthKit; Google — якщо ви оберете вхід через Google; Open Food Facts — для пошуку за штрихкодом; GitHub Pages — для розміщення сайту; вашому поштовому сервісу — якщо ви звернетеся до підтримки. Ці сервіси обробляють дані за власними правилами. Я не передаю дані застосунку рекламодавцям."]],
["Зберігання та строки",["Дані застосунку зберігаються локально на пристрої. Якщо ввімкнено синхронізацію iCloud, синхронізовані записи зберігаються у вашій приватній базі CloudKit. Листування зберігається стільки, скільки потрібно для відповіді, а також протягом розумного строку для обліку чи виконання вимог закону. Технічні журнали сайту обробляє GitHub за власними правилами."]],
["Ваш вибір, доступ і видалення даних",["Ви можете не надавати необов’язковий доступ до камери, HealthKit або iCloud, а синхронізацію iCloud можна вимкнути в застосунку. Ви можете написати мені щодо даних із листування з підтримкою або скористатися правами на конфіденційність, передбаченими у вашій країні.","Поточна версія Fat Alien дає змогу вийти з облікового запису й експортувати дані, але не має повного видалення облікового запису та пов’язаних даних CloudKit безпосередньо в застосунку. Вихід або видалення застосунку не обов’язково видаляє синхронізовані записи iCloud. Щоб попросити допомогти з видаленням, напишіть мені; для видалення даних з iCloud також можуть знадобитися дії в налаштуваннях Apple Account або iCloud. Це обмеження зазначено, щоб політика відповідала поточним можливостям застосунку.","Якщо ви перебуваєте в ЄЕЗ або Великій Британії, ви можете мати право запросити доступ, виправлення, видалення, обмеження обробки чи перенесення даних, заперечити проти певної обробки та відкликати згоду, якщо обробка на ній ґрунтується. Також можна подати скаргу до місцевого органу із захисту даних."]],
["Діти, зміни та контакти",["Fat Alien може запитати дату народження, щоб налаштувати цілі харчування. Батьки чи опікуни, яких турбує обробка даних дитини, можуть зв’язатися зі мною. Я можу оновлювати цю політику, коли змінюються функції або практики; дата вище вказує на останнє оновлення.","З питань конфіденційності або для запитів напишіть на <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>. Не надсилайте паролі, коди входу або непотрібні конфіденційні дані."]]
],linksLabel:"Політики конфіденційності й умови сервісів-провайдерів",links:[["Конфіденційність Apple","https://www.apple.com/legal/privacy/"],["Конфіденційність Google","https://policies.google.com/privacy"],["Конфіденційність GitHub","https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"],["Умови Open Food Facts","https://world.openfoodfacts.org/terms-of-use"]]},
lt:{brand:"Pavlo Kior · Privatumas",back:"Pagalbos puslapis",eyebrow:"Privatumas",title:"Privatumo politika",updated:"Atnaujinta:",intro:"Šioje politikoje paaiškinama, kaip Pavlo Kior tvarko informaciją, kai lankotės programėlių pagalbos svetainėje arba naudojate mano sukurtas programėles. Taikomi tik tie skyriai, kurie susiję su jūsų naudojamomis funkcijomis. „Fat Alien“ praktika aprašyta atskirai.",footer:"Pavlo Kior · Nepriklausomas programėlių kūrėjas",contact:"Susisiekti dėl privatumo",sections:[
["Kas atsakingas už duomenis",["Pavlo Kior atsako už asmens duomenis, kuriuos gauna tiesiogiai, pavyzdžiui, kai kreipiatės į pagalbos tarnybą. Rašykite <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>."]],
["Pagalbos svetainės informacija",["Pagalbos svetainė yra statinė svetainė, talpinama „GitHub Pages“. „GitHub“ gali registruoti lankytojų IP adresus ir techninę užklausų informaciją svetainės veikimui ir saugumui užtikrinti. Svetainėje nėra paskyrų, kontaktinės formos, reklamos, analitikos ar mano pridėtų slapukų. Jei parašysite man el. paštu, gausiu jūsų el. pašto adresą, žinutę ir jūsų pasirinktus priedus, kad galėčiau atsakyti ir išspręsti klausimą."]],
["„Fat Alien“: informacija ir įrenginio leidimai",["Atsižvelgiant į pasirinktas funkcijas, „Fat Alien“ įrenginyje saugo paskyros identifikatorių ir prisijungimo teikėją („Apple“ arba „Google“), el. pašto adresą, jei jį pateikia teikėjas, profilio informaciją (pvz., vardą ar slapyvardį, gimimo datą, lytį, ūgį ir avatarą), maisto dienoraščio įrašus, maistines vertes, pasirinktinius produktus ir receptus, tikslus, svorio ir kūno riebalų rodiklius bei programėlės nuostatas.","Įjungus „iCloud“ sinchronizavimą, programėlės įrašai sinchronizuojami su jūsų asmenine privačia „CloudKit“ duomenų baze, susieta su „Apple Account“. „iCloud“ teikia „Apple“, o duomenis tvarko pagal savo sąlygas ir privatumo politiką. Jums leidus, programėlė gali naudoti „HealthKit“: skaityti aktyviosios ir bazinės energijos, svorio ir kūno riebalų reikšmes bei įrašyti svorį ir kūno riebalus į programą „Health“. „HealthKit“ naudojimas neprivalomas. Kai sinchronizavimas įjungtas, programėlės duomenys gali būti sinchronizuojami su jūsų „iCloud“; atskiro sveikatos duomenų serverio nevaldau.","Ieškant produkto pagal brūkšninį kodą, jo numeris siunčiamas „Open Food Facts“, kad būtų gauta produkto informacija. Užklausoje paslaugai taip pat pateikiami įprasti tinklo duomenys, pvz., IP adresas. Prisijungimo duomenys ar maisto dienoraštis į šią užklausą neįtraukiami. Tekstas nuo maisto etiketės atpažįstamas įrenginyje; vaizdai šia funkcija į mano serverį nesiunčiami."]],
["Kaip naudojama informacija",["Informacija naudojama jūsų pasirinktoms funkcijoms teikti, programėlės duomenims saugoti ir atkurti, sinchronizuoti įjungus „iCloud“, brūkšninių kodų paieškai ir atsakymams į pagalbos užklausas. Peržiūrėtame „Fat Alien“ šaltinio kode nėra trečiųjų šalių reklamos ar analitikos SDK. Asmens duomenų neparduodu."]],
["Paslaugų teikėjai ir kiti gavėjai",["Informacija perduodama tik jūsų pasirinktai funkcijai reikalingoms paslaugoms: „Apple“ — prisijungimui per „Apple“, „iCloud“/„CloudKit“ ir „HealthKit“; „Google“ — jei pasirenkate prisijungti per „Google“; „Open Food Facts“ — brūkšninių kodų paieškai; „GitHub Pages“ — svetainei talpinti; jūsų el. pašto teikėjui — kai rašote pagalbai. Šios paslaugos informaciją tvarko pagal savo privatumo sąlygas. Programėlės informacijos reklamuotojams neteikiu."]],
["Saugojimas ir saugojimo trukmė",["Programėlės informacija saugoma jūsų įrenginyje. Jei įjungtas „iCloud“ sinchronizavimas, sinchronizuoti įrašai saugomi jūsų privačioje „CloudKit“ duomenų bazėje. El. pašto susirašinėjimas saugomas tiek, kiek reikia atsakyti į užklausą ir pagrįstą laiką apskaitos ar teisinių reikalavimų tikslais. Svetainės techninius žurnalus tvarko „GitHub“ pagal savo praktiką."]],
["Jūsų pasirinkimai, prieiga ir ištrynimas",["Galite nesuteikti pasirenkamos prieigos prie kameros, „HealthKit“ ar „iCloud“, o „iCloud“ sinchronizavimą galima išjungti programėlėje. Galite kreiptis dėl pagalbos susirašinėjimo duomenų arba pasinaudoti jūsų gyvenamojoje vietoje galiojančiomis privatumo teisėmis.","Dabartinėje „Fat Alien“ versijoje galima atsijungti ir eksportuoti duomenis, tačiau nėra viso paskyros ir susijusių „CloudKit“ duomenų ištrynimo proceso pačioje programėlėje. Atsijungus ar pašalinus programėlę sinchronizuoti „iCloud“ įrašai nebūtinai ištrinami. Norėdami paprašyti pagalbos dėl ištrynimo, parašykite man; norint pašalinti „iCloud“ duomenis gali reikėti veiksmų „Apple Account“ arba „iCloud“ nustatymuose. Šis apribojimas nurodytas, kad politika atitiktų dabartines programėlės funkcijas.","Jei esate EEE arba JK, galite turėti teisę prašyti prieigos, ištaisymo, ištrynimo, tvarkymo apribojimo ar duomenų perkeliamumo, nesutikti su tam tikru tvarkymu ir atšaukti sutikimą, kai juo grindžiamas tvarkymas. Taip pat galite kreiptis į vietos duomenų apsaugos instituciją."]],
["Vaikai, pakeitimai ir kontaktai",["„Fat Alien“ gali prašyti gimimo datos, kad pritaikytų mitybos tikslus. Tėvai ar globėjai, kuriems kyla klausimų dėl vaiko informacijos tvarkymo, gali susisiekti su manimi. Keičiantis programėlių funkcijoms ar duomenų tvarkymo praktikai, politika gali būti atnaujinta; viršuje pateikta paskutinio atnaujinimo data.","Privatumo klausimais arba norėdami pateikti prašymą rašykite <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>. Nesiųskite slaptažodžių, prisijungimo kodų ar nereikalingos jautrios informacijos."]]
],linksLabel:"Paslaugų teikėjų privatumo politikos ir sąlygos",links:[["„Apple“ privatumas","https://www.apple.com/legal/privacy/"],["„Google“ privatumas","https://policies.google.com/privacy"],["„GitHub“ privatumas","https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"],["„Open Food Facts“ sąlygos","https://world.openfoodfacts.org/terms-of-use"]]},
pl:{brand:"Pavlo Kior · Prywatność",back:"Strona pomocy",eyebrow:"Prywatność",title:"Polityka prywatności",updated:"Ostatnia aktualizacja:",intro:"Ta polityka wyjaśnia, jak Pavlo Kior przetwarza informacje podczas odwiedzania strony pomocy lub korzystania z opracowanych przeze mnie aplikacji. Obowiązują tylko sekcje dotyczące używanych funkcji. Praktyki aplikacji Fat Alien opisano poniżej.",footer:"Pavlo Kior · Niezależny twórca aplikacji",contact:"Kontakt w sprawach prywatności",sections:[
["Administrator danych",["Pavlo Kior odpowiada za dane osobowe otrzymywane bezpośrednio, na przykład gdy kontaktujesz się z pomocą techniczną. Napisz na <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>."]],
["Informacje na stronie pomocy",["Strona pomocy jest statyczną witryną hostowaną przez GitHub Pages. GitHub może rejestrować adresy IP odwiedzających i techniczne informacje o żądaniach w celu zapewnienia działania i bezpieczeństwa witryny. Strona nie ma kont, formularza kontaktowego, reklam, analityki ani plików cookie dodanych przeze mnie. Jeśli napiszesz do mnie e-mail, otrzymam Twój adres, wiadomość i załączniki, które zdecydujesz się wysłać, aby odpowiedzieć i rozwiązać sprawę."]],
["Fat Alien: informacje i uprawnienia urządzenia",["W zależności od wybranych funkcji Fat Alien zapisuje na urządzeniu identyfikator konta i dostawcę logowania (Apple lub Google), adres e-mail, jeśli przekazuje go dostawca logowania, dane profilu (np. imię lub pseudonim, datę urodzenia, płeć, wzrost i awatar), wpisy dziennika żywieniowego, wartości odżywcze, własne produkty i przepisy, cele, pomiary masy ciała i tkanki tłuszczowej oraz ustawienia aplikacji.","Po włączeniu synchronizacji iCloud wpisy aplikacji są synchronizowane z prywatną bazą CloudKit powiązaną z Twoim Apple Account. Usługę iCloud obsługuje Apple, a dane podlegają warunkom i polityce prywatności Apple. Za Twoją zgodą aplikacja może korzystać z HealthKit: odczytywać energię aktywną i spoczynkową, masę ciała i tkankę tłuszczową oraz zapisywać masę ciała i tkankę tłuszczową w aplikacji Zdrowie. Dostęp do HealthKit jest opcjonalny. Przy włączonej synchronizacji dane aplikacji mogą być synchronizowane z iCloud; nie prowadzę osobnego serwera danych zdrowotnych.","Podczas wyszukiwania produktu po kodzie kreskowym Fat Alien wysyła ten kod do Open Food Facts, aby pobrać informacje o produkcie. Żądanie przekazuje usłudze także zwykłe dane sieciowe, takie jak adres IP. Dane logowania ani dziennik żywieniowy nie są dołączane do takiego wyszukiwania. Rozpoznawanie tekstu etykiety odbywa się na urządzeniu; obrazy etykiet nie są wysyłane przez tę funkcję na mój serwer."]],
["Jak wykorzystujemy informacje",["Informacje służą do działania wybranych funkcji, zapisywania i przywracania danych aplikacji, synchronizacji po włączeniu iCloud, wyszukiwania kodów kreskowych oraz odpowiadania na zgłoszenia. W sprawdzonym kodzie źródłowym Fat Alien nie ma zewnętrznych SDK reklamowych ani analitycznych. Nie sprzedaję danych osobowych."]],
["Dostawcy usług i inni odbiorcy",["Informacje trafiają wyłącznie do usług potrzebnych dla wybranej funkcji: Apple — logowanie Apple, iCloud/CloudKit i HealthKit; Google — gdy wybierzesz logowanie Google; Open Food Facts — wyszukiwanie kodów kreskowych; GitHub Pages — hosting strony; oraz dostawca Twojej poczty, gdy kontaktujesz się z pomocą. Usługi te przetwarzają informacje zgodnie z własnymi zasadami. Nie udostępniam danych aplikacji reklamodawcom."]],
["Przechowywanie i okres przechowywania",["Dane aplikacji są przechowywane lokalnie na urządzeniu. Po włączeniu synchronizacji iCloud zsynchronizowane wpisy są przechowywane w prywatnej bazie CloudKit. Korespondencja e-mail jest przechowywana tak długo, jak jest potrzebna do odpowiedzi oraz przez uzasadniony czas do celów ewidencyjnych lub prawnych. Techniczne logi witryny są obsługiwane przez GitHub zgodnie z jego praktykami."]],
["Twoje wybory, dostęp i usuwanie",["Możesz odmówić opcjonalnego dostępu do aparatu, HealthKit lub iCloud, a synchronizację iCloud można wyłączyć w aplikacji. Możesz zapytać o dane z korespondencji z pomocą lub skorzystać z praw do prywatności przysługujących w Twoim miejscu zamieszkania.","Obecna wersja Fat Alien umożliwia wylogowanie i eksport danych, ale nie ma pełnego procesu usunięcia konta i powiązanych danych CloudKit w aplikacji. Wylogowanie lub odinstalowanie aplikacji nie musi usuwać zsynchronizowanych wpisów iCloud. Aby poprosić o pomoc w usunięciu danych, napisz do mnie; usunięcie danych z iCloud może wymagać również działań w ustawieniach Apple Account lub iCloud. Informacja ta odzwierciedla aktualne funkcje aplikacji.","Jeśli mieszkasz w EOG lub Wielkiej Brytanii, możesz mieć prawo do żądania dostępu, sprostowania, usunięcia, ograniczenia przetwarzania lub przeniesienia danych, wniesienia sprzeciwu wobec niektórych działań i wycofania zgody, gdy przetwarzanie się na niej opiera. Możesz także złożyć skargę do lokalnego organu ochrony danych."]],
["Dzieci, zmiany i kontakt",["Fat Alien może prosić o datę urodzenia, aby dostosować cele żywieniowe. Rodzic lub opiekun, który ma obawy dotyczące danych dziecka, może się ze mną skontaktować. Polityka może być aktualizowana wraz ze zmianą funkcji lub praktyk; data u góry wskazuje ostatnią aktualizację.","W sprawach prywatności lub z żądaniami napisz na <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>. Nie wysyłaj haseł, kodów logowania ani zbędnych poufnych informacji."]]
],linksLabel:"Polityki prywatności i warunki dostawców",links:[["Prywatność Apple","https://www.apple.com/legal/privacy/"],["Prywatność Google","https://policies.google.com/privacy"],["Prywatność GitHub","https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"],["Warunki Open Food Facts","https://world.openfoodfacts.org/terms-of-use"]]},
de:{brand:"Pavlo Kior · Datenschutz",back:"Supportseite",eyebrow:"Datenschutz",title:"Datenschutzerklärung",updated:"Zuletzt aktualisiert:",intro:"Diese Erklärung beschreibt, wie Pavlo Kior Informationen verarbeitet, wenn du die Supportwebsite besuchst oder eine von mir entwickelte App nutzt. Es gelten nur die Abschnitte zu den Funktionen, die du verwendest. Die Datenverarbeitung von Fat Alien wird unten gesondert beschrieben.",footer:"Pavlo Kior · Unabhängiger App-Entwickler",contact:"Datenschutzkontakt",sections:[
["Verantwortlicher",["Pavlo Kior ist für personenbezogene Daten verantwortlich, die ich direkt erhalte, zum Beispiel wenn du den Support kontaktierst. Du erreichst mich unter <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>."]],
["Informationen auf der Supportwebsite",["Die Supportwebsite ist eine statische Website, die von GitHub Pages gehostet wird. GitHub kann IP-Adressen von Besuchern und technische Anfragedaten protokollieren, um die Website bereitzustellen und zu schützen. Die Website hat keine Konten, kein Kontaktformular, keine Werbung, keine Analysewerkzeuge und keine von mir hinzugefügten Cookies. Wenn du mir eine E-Mail schreibst, erhalte ich deine E-Mail-Adresse, Nachricht und Anhänge, die du mitsendest, und nutze sie, um zu antworten und dein Anliegen zu klären."]],
["Fat Alien: Daten und Geräteberechtigungen",["Je nach verwendeten Funktionen speichert Fat Alien auf deinem Gerät eine Konto-ID und den Anmeldeanbieter (Apple oder Google), eine vom Anbieter übermittelte E-Mail-Adresse, Profildaten (z. B. Name oder Spitzname, Geburtsdatum, Geschlecht, Größe und Avatar), Ernährungstagebucheinträge, Nährwerte, eigene Lebensmittel und Rezepte, Ziele, Gewichts- und Körperfettmessungen sowie App-Einstellungen.","Wenn du iCloud-Synchronisierung aktivierst, werden App-Datensätze mit deiner persönlichen privaten CloudKit-Datenbank synchronisiert, die mit deinem Apple Account verbunden ist. iCloud wird von Apple betrieben; es gelten Apples Bedingungen und Datenschutzhinweise. Mit deiner Erlaubnis kann die App HealthKit nutzen: aktive und Ruheenergie sowie Gewicht und Körperfett lesen und Gewicht und Körperfett in Health schreiben. HealthKit ist optional. Bei aktivierter Synchronisierung können App-Daten mit deiner iCloud-Datenbank synchronisiert werden; ich betreibe keinen separaten Server für Gesundheitsdaten.","Bei einer Suche nach einem Produkt per Barcode sendet Fat Alien den Barcode an Open Food Facts, um Produktinformationen abzurufen. Die Anfrage übermittelt dem Dienst auch übliche Netzwerkdaten wie deine IP-Adresse. Anmeldedaten oder Ernährungstagebuch werden bei dieser Suche nicht mitgesendet. Die Erkennung von Etikettentext erfolgt auf deinem Gerät; Bilder von Etiketten werden durch diese Funktion nicht an meinen Server gesendet."]],
["Verwendung der Informationen",["Informationen werden verwendet, um die von dir gewählten Funktionen bereitzustellen, App-Daten zu speichern und wiederherzustellen, bei aktivierter iCloud-Synchronisierung Daten abzugleichen, Barcodes abzufragen und Supportanfragen zu beantworten. Der für diese Erklärung geprüfte Fat-Alien-Quellcode enthält keine Werbe- oder Analyse-SDKs von Drittanbietern. Ich verkaufe keine personenbezogenen Daten."]],
["Dienstleister und andere Empfänger",["Informationen werden nur an Dienste weitergegeben, die für die gewählte Funktion benötigt werden: Apple für Apple-Anmeldung, iCloud/CloudKit und HealthKit; Google, wenn du Google-Anmeldung wählst; Open Food Facts für Barcode-Suchen; GitHub Pages für das Hosting dieser Website; und deinen E-Mail-Anbieter, wenn du den Support kontaktierst. Diese Anbieter verarbeiten Daten nach ihren eigenen Datenschutzbestimmungen. Ich gebe keine App-Daten an Werbetreibende weiter."]],
["Speicherung und Aufbewahrung",["App-Daten werden lokal auf deinem Gerät gespeichert. Bei aktivierter iCloud-Synchronisierung werden synchronisierte Datensätze in deiner privaten CloudKit-Datenbank gespeichert. E-Mail-Korrespondenz wird so lange aufbewahrt, wie sie zur Beantwortung deiner Anfrage und für eine angemessene Dokumentation oder gesetzliche Pflichten erforderlich ist. Technische Website-Protokolle verarbeitet GitHub nach eigenen Verfahren."]],
["Deine Wahlmöglichkeiten, Auskunft und Löschung",["Du kannst optionale Kamera-, HealthKit- oder iCloud-Berechtigungen ablehnen und die iCloud-Synchronisierung in der App deaktivieren. Du kannst mich zu Informationen aus Supportnachrichten kontaktieren oder Datenschutzrechte geltend machen, die an deinem Wohnort gelten.","Die aktuelle Fat-Alien-Version ermöglicht Abmeldung und Datenexport, bietet jedoch keine vollständige Löschung des Kontos und der zugehörigen CloudKit-Daten direkt in der App. Abmelden oder Deinstallieren löscht synchronisierte iCloud-Datensätze nicht unbedingt. Wenn du Hilfe bei einer Löschung benötigst, schreibe mir; zum Entfernen von iCloud-Daten können zusätzlich Schritte in den Einstellungen des Apple Accounts oder von iCloud erforderlich sein. Dieser Hinweis entspricht den aktuellen App-Funktionen.","Wenn du im EWR oder im Vereinigten Königreich wohnst, hast du möglicherweise Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung oder Übertragbarkeit, auf Widerspruch gegen bestimmte Verarbeitungen und auf Widerruf einer Einwilligung, wenn die Verarbeitung darauf beruht. Außerdem kannst du dich bei deiner örtlichen Datenschutzbehörde beschweren."]],
["Kinder, Änderungen und Kontakt",["Fat Alien kann nach dem Geburtsdatum fragen, um Ernährungsziele anzupassen. Eltern oder Erziehungsberechtigte können sich bei Bedenken zur Verarbeitung von Kinderdaten an mich wenden. Wenn sich Funktionen oder Datenpraktiken ändern, kann ich diese Erklärung aktualisieren; das Datum oben zeigt die letzte Aktualisierung.","Bei Datenschutzfragen oder Anfragen schreibe an <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>. Sende keine Passwörter, Anmeldecodes oder unnötigen vertraulichen Informationen."]]

es:{brand:"Pavlo Kior · Privacidad",back:"Página de soporte",eyebrow:"Privacidad",title:"Política de privacidad",updated:"Última actualización:",intro:"Esta política explica cómo Pavlo Kior trata la información cuando visitas el sitio de soporte o utilizas una aplicación que he desarrollado. Solo se aplican las secciones relacionadas con las funciones que uses. Las prácticas de Fat Alien se describen por separado a continuación.",footer:"Pavlo Kior · Desarrollador independiente de aplicaciones",contact:"Contacto sobre privacidad",sections:[
["Responsable de los datos",["Pavlo Kior es responsable de los datos personales que recibe directamente, por ejemplo cuando contactas con soporte. Puedes escribirme a <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>."]],
["Información del sitio de soporte",["El sitio de soporte es un sitio estático alojado en GitHub Pages. GitHub puede registrar las direcciones IP de los visitantes y datos técnicos de las solicitudes para prestar y proteger el sitio. El sitio no tiene cuentas, formularios de contacto, publicidad, herramientas de analítica ni cookies añadidas por mí. Si me escribes por correo, recibo tu dirección, el mensaje y los archivos adjuntos que decidas enviar; los uso para responder y resolver tu solicitud."]],
["Fat Alien: información y permisos del dispositivo",["Según las funciones que elijas, Fat Alien almacena en tu dispositivo un identificador de cuenta y el proveedor de inicio de sesión (Apple o Google), la dirección de correo si el proveedor la facilita, datos del perfil (por ejemplo, nombre o apodo, fecha de nacimiento, sexo, altura y avatar), registros del diario de comidas, valores nutricionales, alimentos y recetas personalizados, objetivos, mediciones de peso y grasa corporal, y preferencias de la aplicación.","Si activas la sincronización de iCloud, los datos de la aplicación se sincronizan con tu base de datos privada de CloudKit asociada a tu Apple Account. Apple proporciona iCloud y trata esos datos según sus condiciones y política de privacidad. Con tu permiso, la aplicación puede usar HealthKit para leer energía activa y en reposo, peso y grasa corporal, y para escribir peso y grasa corporal en Salud. HealthKit es opcional. Con la sincronización activada, los datos de la aplicación pueden sincronizarse con tu iCloud; no gestiono un servidor propio de datos de salud.","Al buscar un producto mediante su código de barras, Fat Alien envía ese código a Open Food Facts para consultar los datos del producto. La solicitud también transmite información de red habitual, como tu dirección IP. No incluye tus datos de inicio de sesión ni tu diario de comidas. El reconocimiento del texto de las etiquetas se procesa en el dispositivo; esta función no envía las imágenes de las etiquetas a mi servidor."]],
["Cómo se utiliza la información",["La información se utiliza para ofrecer las funciones que solicitas, guardar y restaurar los datos de la aplicación, sincronizarlos cuando activas iCloud, buscar códigos de barras y responder a solicitudes de soporte. El código fuente de Fat Alien revisado para esta política no incluye SDK de publicidad ni de analítica de terceros. No vendo datos personales."]],
["Proveedores de servicios y otros destinatarios",["La información solo se comparte con los servicios necesarios para la función elegida: Apple para Iniciar sesión con Apple, iCloud/CloudKit y HealthKit; Google si eliges iniciar sesión con Google; Open Food Facts para las búsquedas por código de barras; GitHub Pages para alojar este sitio; y tu proveedor de correo cuando contactas con soporte. Estos servicios tratan la información según sus propias políticas. No entrego datos de la aplicación a anunciantes."]],
["Almacenamiento y conservación",["Los datos de la aplicación se almacenan localmente en tu dispositivo. Si activas la sincronización de iCloud, los registros sincronizados se guardan en tu base de datos privada de CloudKit. Los correos se conservan durante el tiempo necesario para responder y durante un plazo razonable por motivos de registro o requisitos legales. GitHub gestiona los registros técnicos del sitio según sus propias prácticas."]],
["Tus opciones, acceso y eliminación",["Puedes denegar los permisos opcionales de cámara, HealthKit o iCloud, y desactivar la sincronización de iCloud en la aplicación. Puedes contactarme para consultar información de tus mensajes de soporte o ejercer los derechos de privacidad disponibles en tu lugar de residencia.","La versión actual de Fat Alien permite cerrar sesión y exportar datos, pero no ofrece una eliminación completa de la cuenta y de los datos asociados de CloudKit desde la aplicación. Cerrar sesión o desinstalar la aplicación no necesariamente elimina los registros sincronizados con iCloud. Para solicitar ayuda con una eliminación, escríbeme; borrar datos de iCloud también puede requerir acciones en los controles de Apple Account o iCloud. Esta limitación se indica para reflejar las funciones actuales de la aplicación.","Si resides en el EEE o el Reino Unido, puedes tener derecho a solicitar acceso, rectificación, eliminación, limitación o portabilidad de los datos, oponerte a ciertos tratamientos y retirar el consentimiento cuando el tratamiento se base en él. También puedes presentar una reclamación ante la autoridad local de protección de datos."]],
["Menores, cambios y contacto",["Fat Alien puede solicitar la fecha de nacimiento para personalizar los objetivos nutricionales. Los padres o tutores que tengan dudas sobre el tratamiento de los datos de un menor pueden ponerse en contacto conmigo. Puedo actualizar esta política si cambian las funciones o las prácticas de datos; la fecha superior indica la última actualización.","Para consultas o solicitudes de privacidad, escribe a <a class='contact-link' href='mailto:kiorpavlo@gmail.com'>kiorpavlo@gmail.com</a>. No envíes contraseñas, códigos de acceso ni información confidencial innecesaria."]]

const langSelect=document.getElementById('language');const requested=new URLSearchParams(location.search).get('lang');const detected=(navigator.languages||[navigator.language||'en']).map(x=>x.toLowerCase().split('-')[0]).find(x=>copy[x]);langSelect.value=copy[requested]?requested:(detected||'en');
function render(lang){const c=copy[lang]||copy.en;document.documentElement.lang=lang;document.title=c.brand;document.getElementById('brand').textContent=c.brand;document.getElementById('back').textContent=c.back;document.getElementById('eyebrow').textContent=c.eyebrow;document.getElementById('title').textContent=c.title;document.getElementById('updated-label').textContent=c.updated;document.getElementById('intro').textContent=c.intro;document.getElementById('footer').textContent=c.footer;document.getElementById('contact-link').textContent=c.contact;document.getElementById('language').setAttribute('aria-label',lang);document.getElementById('home-link').href='index.html?lang='+encodeURIComponent(lang);document.getElementById('back').href='index.html?lang='+encodeURIComponent(lang);const container=document.getElementById('sections');container.replaceChildren();for(const [heading,paragraphs] of c.sections){const section=document.createElement('section');section.className='policy-section';const h=document.createElement('h2');h.textContent=heading;section.append(h);for(const copyText of paragraphs){const p=document.createElement('p');p.innerHTML=copyText;section.append(p)}container.append(section)}const providers=document.createElement('section');providers.className='policy-section';const heading=document.createElement('h2');heading.textContent=c.linksLabel;providers.append(heading);const links=document.createElement('div');links.className='provider-links';for(const [label,url] of c.links){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;links.append(a)}providers.append(links);container.append(providers)}
langSelect.addEventListener('change',()=>{const lang=langSelect.value;history.replaceState(null,'','?lang='+encodeURIComponent(lang));render(lang)});render(langSelect.value);
</script></body></html>
